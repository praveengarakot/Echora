name: Echora verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Compact compiler 0.31.0
        run: |
          mkdir -p "$HOME/.compact/bin"
          curl -L --fail -o /tmp/compactc.zip https://github.com/midnightntwrk/compact/releases/download/compactc-v0.31.0/compactc_v0.31.0_x86_64-unknown-linux-musl.zip
          unzip -o /tmp/compactc.zip -d "$HOME/.compact/bin"
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Compile Compact contract and sync browser artifacts
        run: npm run compile
      - name: Run contract tests
        run: npm test
      - name: Type-check frontend
        run: npx tsc --noEmit -p frontend/tsconfig.json
      - name: Build frontend
        run: npm run build
